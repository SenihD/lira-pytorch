# Minimal environment for starting a project using conda/mamba:
# conda env create -n ENVNAME --file ENV.yml

name: lira_env 
channels:
  # For non apple environments, add: - nvidia
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # For non apple environments, add: - pytorch-cuda=11.8
  - python=3.10
  - pip
  - setuptools
  - pytest
  - setuptools<81
  - numpy
  - scipy
  - scikit-learn
  - matplotlib
  - pandas
  - tqdm
  - wandb
  - jupyterlab
  - jupyter
  - ipykernel
  - pytorch
  - torchvision
  - torchaudio
  - tqdm
  - pytorch-lightning
  - lightning-bolts
  - torchmetrics

  # Install packages with pip
  - pip:
    - setuptools<70.0.0
    - gdown
